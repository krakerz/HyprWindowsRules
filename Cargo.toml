[package]
name = "hypr-rules"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "GUI to manage Hyprland (Lua config) window rules without hand-editing files or writing regex"
license = "MIT"
repository = "https://github.com/krakerz/HyprWindowsRules"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
iced = { version = "0.14", features = ["tokio"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["time"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "time"] }
